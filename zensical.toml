[project]
site_name = "Notes"
site_description = "Learning notes."
site_author = "ShenMian"
site_url = "https://shenmian.github.io/notes/"
repo_name = "ShenMian/notes"
repo_url = "https://github.com/ShenMian/notes/"

[project.theme]
variant = "classic"
custom_dir = "overrides"
language = "zh"
include_search_page = false
search_index_only = true
static_templates = ["404.html"]
features = [
  "navigation.tabs",
  "navigation.path",
  "navigation.prune",
  "navigation.top",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "content.code.copy",
  "social"
]

[project.theme.font]
text = "fonts/SourceHanSerifSC-Regular.otf, Roboto"
code = "fonts/CascadiaCodeNF.woff2"

[[project.theme.palette]]
scheme = "default"
primary = "green"
accent = "green"
toggle.icon = "material/brightness-7"
toggle.name = "浅色模式"

[[project.theme.palette]]
scheme = "slate"
primary = "green"
accent = "green"
toggle.icon = "material/brightness-4"
toggle.name = "深色模式"

[project.plugins.git-revision-date-localized]
timezone = "Asia/Shanghai"

[project.plugins.rss]
use_git = true

[project.plugins.rss.date_from_meta]
as_creation = "git"
as_update = "git"
datetime_format = "%Y-%m-%d %H:%M"
default_timezone = "Asia/Shanghai"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/ShenMian"
