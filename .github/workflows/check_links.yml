name: Check links

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * 0" # At 00:00 on Sunday

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # .lycheeignore and lychee.toml at the repo root are picked up automatically.
          args: --verbose --no-progress './**/*.md'
          fail: true
